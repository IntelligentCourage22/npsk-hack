<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Gazing Form</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Sansita+Swashed:wght@600&display=swap");

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .center {
            position: relative;
            padding: 50px 50px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .center h1 {
            font-size: 2em;
            padding: 10px;
            color: #000;
            letter-spacing: 5px;
            margin-bottom: 40px;
            font-weight: bold;
            text-align: center;
        }

        .center .inputbox {
            position: relative;
            width: 300px;
            height: 50px;
            margin-bottom: 30px;
        }

        .center .inputbox input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            border: 2px solid #000;
            outline: none;
            background: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 1.2em;
        }

        .center .inputbox:last-child {
            margin-bottom: 0;
        }

        .center .inputbox span {
            position: absolute;
            top: 14px;
            left: 20px;
            font-size: 1em;
            transition: 0.6s;
            font-family: sans-serif;
        }

        .center .inputbox input:focus~span,
        .center .inputbox input:valid~span {
            transform: translateX(-13px) translateY(-35px);
            font-size: 1em;
        }

        .center .inputbox [type="submit"] {
            width: 50%;
            background: dodgerblue;
            color: #fff;
            border: #fff;
            cursor: pointer;
            transition: 0.2s;
        }

        .center .inputbox [type="submit"]:hover {
            background: linear-gradient(45deg, greenyellow, dodgerblue);
        }

        .center .star-gaze-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .center .star-gaze-btn button {
            width: 200px;
            padding: 10px;
            background-color: dodgerblue;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-family: 'Sansita Swashed', cursive;
            cursor: pointer;
            transition: 0.2s;
        }

        .center .star-gaze-btn button:hover {
            background-color: #38a3a3;
        }
    </style>
</head>

<body>
    <div class="center">
        <h1>Enter Coordinates</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="inputbox">
                <input type="text" id="lat" name="lat" required>
                <span>Latitude</span>
            </div>
            <div class="inputbox">
                <input type="text" id="long" name="long" required>
                <span>Longitude</span>
            </div>
            <div class="inputbox">
                <input type="datetime-local" id="date" name="date" required>
                <span> </span>
            </div>
            <div class="inputbox">
                <input type="submit" value="Submit">
            </div>
        </form>
        <div class="star-gaze-btn">
            <button onclick="starGaze()">Star Gaze Now</button>
        </div>
    </div>
</body>

</html>
