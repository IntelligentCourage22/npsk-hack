<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Gazing Form</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Sansita+Swashed:wght@600&display=swap");

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .form-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        .form-container h2 {
            font-size: 1.5em;
            font-family: 'Sansita Swashed', cursive;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-container label,
        .form-container input,
        .form-container select {
            display: block;
            width: 100%;
            margin-bottom: 15px;
        }

        .form-container input[type="submit"] {
            width: auto;
            background-color: dodgerblue;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .form-container input[type="submit"]:hover {
            background-color: #0f7fd4;
        }

        .additional-form {
            display: none;
            margin-top: 20px;
        }

        .additional-form label,
        .additional-form input,
        .additional-form select {
            display: block;
            width: 100%;
            margin-bottom: 15px;
        }

        .additional-form input[type="submit"] {
            width: auto;
            background-color: dodgerblue;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .additional-form input[type="submit"]:hover {
            background-color: #0f7fd4;
        }

        .show-additional-form {
            text-align: center;
            cursor: pointer;
            color: dodgerblue;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div style="display: flex;">
        <div style="width: 50%; padding: 20px;">
            <!-- Star Gazing Form -->
            <div class="form-container">
                <form method="POST">
                    {% csrf_token %}
                    <label for="j200_ra">J2000 RA:</label>
                    <input type="text" id="j200_ra" name="j200_ra">

                    <label for="j200_dec">J2000 Dec:</label>
                    <input type="text" id="j200_dec" name="j200_dec">

                    <label for="dist">Distance:</label>
                    <input type="text" id="dist" name="dist">

                    <label for="mag">Magnitude:</label>
                    <input type="text" id="mag" name="mag">

                    <label for="lum">Luminosity:</label>
                    <input type="text" id="lum" name="lum">

                    <label for="constellation">Constellation:</label>
                    <input type="text" id="constellation" name="constellation">

                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
        <div style="width: 50%; padding: 20px;">
            <!-- Star Details Display -->
            {% if star_details %}
            {% for key, value in star_details.items %}
            <li><strong>{{ key }}:</strong> {{ value }}</li>
            {% endfor %}
            {% endif %}
            {% if star_list %}
            <h1>The star could also be:</h1>
            {% for star in star_list %}
            <li><strong>{{star}}</strong> </li>
            {% endfor %}
            {% endif %}

        </div>
    </div>

    <script>
    </script>
</body>

</html>
